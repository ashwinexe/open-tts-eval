asr:
  backend: faster-whisper
  model: base.en
  device: cpu
  compute_type: int8
  language: en
normalization:
  backend: english-basic
  plugin: null
  expand_numbers: true
optional_metrics:
  nisqa_v2: false
  speaker_similarity: false
  vowel_prolongation: true
  voice_lens: true
  open_aligner: false
thresholds:
  wer:
    warn: 0.05
    fail: 0.1
    warn_below: null
    fail_below: null
    fail_if_true: null
  cer:
    warn: 0.03
    fail: 0.08
    warn_below: null
    fail_below: null
    fail_if_true: null
  insertion_rate:
    warn: 0.03
    fail: 0.08
    warn_below: null
    fail_below: null
    fail_if_true: null
  tail_click_detected:
    warn: null
    fail: null
    warn_below: null
    fail_below: null
    fail_if_true: true
  clipping_ratio:
    warn: 0.001
    fail: 0.01
    warn_below: null
    fail_below: null
    fail_if_true: null
  silence_ratio:
    warn: 0.45
    fail: 0.65
    warn_below: null
    fail_below: null
    fail_if_true: null
  vowel_prolongation_score:
    warn: null
    fail: 0.8
    warn_below: null
    fail_below: null
    fail_if_true: null
  speaker_similarity:
    warn: null
    fail: null
    warn_below: 0.65
    fail_below: 0.55
    fail_if_true: null
  nisqa_mos:
    warn: null
    fail: null
    warn_below: 3.3
    fail_below: 2.8
    fail_if_true: null
reporting:
  html: true
  csv: true
  max_worst_samples: 25
  max_violation_examples: 5
  confidence_level: 0.95
  bootstrap_resamples: 2000
  group_by_voice: true
  embed_audio: true
  health_good_rate: 0.99
  health_warn_rate: 0.95
  title: TTS Assessment Report
  question: Are these TTS audios acceptable for the configured quality thresholds?
